name: Mise à jour des sondages
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_polls.py
      - run: python scripts/validate_data.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refresh polling snapshot"
